openapi: 3.0.3
info:
  title: SF Mission Control API
  version: "1.1.0"
  description: >
    JSON data/action routes live under `/api/v1/<tab>/...` (one prefix per
    tab/blueprint, e.g. `/api/v1/cli`, `/api/v1/data-ops`). HTML page routes
    (server-rendered Jinja2 templates, e.g. `GET /cli`, `GET /data-ops/import`)
    are unversioned and intentionally excluded from this spec — it documents
    the JSON contract only.

    Pre-versioning JSON paths (e.g. the old `POST /cli/generate`) still work:
    every page blueprint carries a catch-all that 308-redirects
    `/<tab>/<subpath>` to `/api/v1/<tab>/<subpath>`, preserving method and body,
    so existing integrations (frontend `MC.api` calls, CLI/Argo scripts) keep
    working unmodified during the transition window
    (`utils.responses.register_legacy_json_redirect`).

    Two path-shape anomalies under Data Ops predate this pass and keep their
    corrected (non-redundant) homes rather than becoming `/api/v1/data-ops/api/...`:
    `GET /api/v1/data-ops/record-locks` and `GET /api/v1/data-ops/bulk-jobs`.
servers:
  - url: /
    description: SF Mission Control (path-relative; same origin as the UI)
components:
  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
      required: [success, data]
    Error:
      type: object
      description: Standards error envelope (superset of the app's {success,error}).
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        code: { type: string, example: INVALID_INPUT }
        request_id: { type: string }
      required: [success, error, code, request_id]
tags:
  - name: Health
    description: Liveness/readiness probes. No auth, no dependency calls on the liveness path.
  - name: Meta
    description: Shared describe-driven object-picker source used by every tab's SObject input.
  - name: Migration
    description: Pre-go-live readiness scorecard, batch progress, Conductor error reconciliation, velocity, preflight checklist.
  - name: Validation
    description: Duplicate PersonAccount radar, external-ID coverage, ContactPoint integrity, field completeness, orphan scan, merge history.
  - name: SOQL
    description: SOQL Workbench — run queries, browse schema, saved queries, history, inline record edit.
  - name: Schema
    description: EDA→Ed Cloud crosswalk diff, org/metadata diff, field usage, field finder, data dictionary, Apex search, schema snapshots, record inspector.
  - name: Data Ops
    description: CSV import/export, bulk delete/modify/reassign, file migration, data backup, SQL Server↔Salesforce join builder, data tuning, fuzzy match, bulk update, record locks, bulk job history.
  - name: Settings
    description: Org connection tests, active-org switch, trigger-bypass toggle, Postman collection runner.
  - name: Observe
    description: Org limits, data-quality trends, storage breakdown, sandbox drift, cross-org counts, alert thresholds.
  - name: Logs
    description: Apex debug logs, flow/process errors, trace flags and debug levels.
  - name: Impact
    description: Field impact scan, permission auditing, regression test suites, permission-set gap analysis.
  - name: Admin
    description: Org configuration inventory — scheduled jobs, coverage, deploy history, users, integrations, platform events, record types, email templates, audit trail, job queue, login history, custom metadata/settings, permissions, automation inventory, data anonymizer.
  - name: Deploy
    description: Change Set Builder — list deployable components and generate a package.
  - name: Dashboard
    description: Mission Control home page summary stats.
  - name: Scenarios
    description: Multi-step Data Ops pipelines — CRUD, run, run history, Argo scheduling, tags.
  - name: Key Maps
    description: Source → Salesforce Key Map engine — CRUD, FK lookups, family/variant routing, preview, CSV export.
  - name: CLI
    description: Salesforce CLI script + metadata-package generator — describe, field-level security clone, record type/layout paste-and-inject, snippet + package generation, object clone, access mirror.
paths:
  # ── Health ────────────────────────────────────────────────────────────────
  /api/v1/health:
    get:
      summary: "Liveness probe — no dependency calls, always 200 while the process is alive."
      tags: [Health]
      responses:
        "200": { description: "{status, service, version, uptime_seconds}", content: { application/json: { schema: { type: object } } } }
  /api/v1/health/deep:
    get:
      summary: "Readiness probe — real dependency checks. Postgres is non-critical: a DB outage reports 200/\"degraded\", never 503."
      tags: [Health]
      responses:
        "200": { description: "{status, service, version, uptime_seconds, mock, checks}", content: { application/json: { schema: { type: object } } } }
  # ── Meta ──────────────────────────────────────────────────────────────────
  /api/v1/meta/objects:
    get:
      summary: "The org's SObjects with capability flags (queryable/layoutable/createable/updateable/deletable) — shared source for every tab's object picker."
      tags: [Meta]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "502": { description: "Salesforce describe failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  # ── Migration ─────────────────────────────────────────────────────────────
  /api/v1/migration/readiness/run:
    post:
      summary: "Run the full pre-go-live readiness scorecard and persist the result."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Readiness check failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/readiness/history:
    get:
      summary: "Recent readiness run history (most recent 30)."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "History query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/batches/recent:
    get:
      summary: "Recent migration batches — feeds the dashboard Batches widget."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Recent batches query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/batch/status:
    get:
      summary: "Conductor workflow batch status plus failure reasons."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Batch status query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/batch/rerun:
    post:
      summary: "Rerun one or more Conductor workflows by id."
      tags: [Migration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ids], properties: { ids: { type: array, items: { type: string } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "workflow_ids is required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Rerun failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/reconciler/errors:
    get:
      summary: "Categorize recent Conductor failures by error type."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Categorization failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/errors/requeue:
    post:
      summary: "Requeue a failed migration batch."
      tags: [Migration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [batch_id], properties: { batch_id: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "batch_id required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Requeue failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/reconciler/rerun:
    post:
      summary: "Rerun workflows by SIS id / workflow id."
      tags: [Migration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sis_ids], properties: { sis_ids: { type: array, items: { type: string } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "workflow_ids is required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Rerun failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/velocity/data:
    get:
      summary: "Migration velocity time-series data (records/day)."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Velocity query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/preflight/items:
    get:
      summary: "List (seeding defaults on first call) the pre-go-live checklist items."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Checklist query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/preflight/toggle:
    post:
      summary: "Toggle a preflight checklist item's checked state."
      tags: [Migration]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: integer }, checked: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "id required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Toggle failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/migration/preflight/progress:
    get:
      summary: "Preflight checklist completion percentage."
      tags: [Migration]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Progress query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  # ── Validation ────────────────────────────────────────────────────────────
  /api/v1/validation/duplicates/scan:
    post:
      summary: "Scan for duplicate PersonAccount records."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Scan failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/duplicates/merge:
    post:
      summary: "Merge a duplicate PersonAccount pair (master keeps id, victim is merged in)."
      tags: [Validation]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [master_id, victim_id], properties: { master_id: { type: string }, victim_id: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "master_id and victim_id are required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Merge failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/external-ids/run:
    get:
      summary: "SIS_ID__c / Ethos_Guid__c external-id coverage report."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Coverage run failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/contactpoints/scan:
    get:
      summary: "Scan for broken ContactPoint parent links (null or wrongly-typed ParentId/IndividualId)."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Scan failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/completeness/run:
    get:
      summary: "Field completeness (population rate) report."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Completeness run failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/orphans/scan:
    get:
      summary: "Scan for orphaned records (dangling lookups)."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Scan failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/merge-history/list:
    get:
      summary: "List past PersonAccount merges."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "History query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/validation/merge-history/stats:
    get:
      summary: "Merge history summary stats."
      tags: [Validation]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Stats query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  # ── SOQL ──────────────────────────────────────────────────────────────────
  /api/v1/soql/run:
    post:
      summary: "Execute a SOQL query (optionally paging through all results)."
      tags: [SOQL]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [soql], properties: { soql: { type: string }, all_pages: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "query is required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Query execution failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/objects:
    get:
      summary: "List queryable SObjects."
      tags: [SOQL]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Object list failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/objects/{name}/fields:
    get:
      summary: "List fields for a queryable SObject."
      tags: [SOQL]
      parameters:
        - { in: path, name: name, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Field describe failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/saved:
    get:
      summary: "List this user's saved queries."
      tags: [SOQL]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Saved query list failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: "Save a query."
      tags: [SOQL]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, query], properties: { name: { type: string }, query: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "name and query are required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Save failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/saved/{query_id}:
    delete:
      summary: "Delete a saved query."
      tags: [SOQL]
      parameters:
        - { in: path, name: query_id, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Delete failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/history:
    get:
      summary: "Query run history for this user/org."
      tags: [SOQL]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "History query failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/history/{history_id}:
    delete:
      summary: "Delete a query history entry."
      tags: [SOQL]
      parameters:
        - { in: path, name: history_id, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Delete failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/soql/update:
    post:
      summary: "Inline-edit a single record's field value from query results."
      tags: [SOQL]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [object_name, record_id, field_name], properties: { object_name: { type: string }, record_id: { type: string }, field_name: { type: string }, value: {  } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "object_name, record_id and field_name are required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Update failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  # ── Schema ────────────────────────────────────────────────────────────────
  /api/v1/schema/crosswalk/upload:
    post:
      summary: "Upload and parse an EDA→Ed Cloud field-mapping CSV."
      tags: [Schema]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "No file uploaded / Empty filename", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Parse failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/crosswalk/run:
    post:
      summary: "Run a live crosswalk field-mapping check against the active org."
      tags: [Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { mappings: { type: array, items: { type: object } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Live check failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/field-usage/run:
    post:
      summary: "Scan an object's field population/usage."
      tags: [Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sobject], properties: { sobject: { type: string }, fields: { type: array, items: { type: string } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "sobject required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Usage scan failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/field-finder/run:
    post:
      summary: "Find which objects have a given field — inverse of the Data Dictionary."
      tags: [Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [field], properties: { field: { type: string }, include_standard: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "field required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Lookup failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/data-dictionary/run:
    post:
      summary: "Full field catalog (Data Dictionary) for an object."
      tags: [Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [sobject], properties: { sobject: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "sobject required", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Catalog build failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/apex-search/run:
    post:
      summary: "Search Apex classes/triggers for a text pattern."
      tags: [Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pattern], properties: { pattern: { type: string }, case_sensitive: { type: boolean }, include_classes: { type: boolean }, include_triggers: { type: boolean } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "pattern required / pattern must be at least 2 characters", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Search failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/snapshots/list:
    get:
      summary: "List saved schema snapshots."
      tags: [Schema]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "List failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/snapshots/take:
    post:
      summary: "Take a new schema snapshot of an object."
      tags: [Schema]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { sobject: { type: string }, label: { type: string } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "500": { description: "Snapshot failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/snapshots/diff:
    get:
      summary: "Diff two schema snapshots by id."
      tags: [Schema]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        "400": { description: "invalid snapshot ids", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "500": { description: "Diff failed", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/schema/snapshots/{snap_id}:
    delete:
      summary: "Delete a schema snapshot."
